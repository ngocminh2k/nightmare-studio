<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Harkness Road · ngôi nhà hẻo lánh">
  <defs>
    <linearGradient id="sky1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0207"/>
      <stop offset=".55" stop-color="#1d0814"/>
      <stop offset="1" stop-color="#3b0a18"/>
    </linearGradient>
    <linearGradient id="ground1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a0a10"/>
      <stop offset="1" stop-color="#06020a"/>
    </linearGradient>
    <radialGradient id="moon1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5e8c8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f5e8c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="480" height="270" fill="url(#sky1)"/>
  <circle cx="380" cy="60" r="40" fill="url(#moon1)"/>
  <circle cx="380" cy="60" r="14" fill="#f5e8c8" opacity=".85"/>
  <!-- Distant trees silhouette -->
  <path d="M0 180 L20 140 L40 170 L60 130 L80 165 L100 140 L120 175 L150 130 L180 165 L220 140 L260 175 L300 140 L340 175 L380 145 L420 170 L460 145 L480 175 L480 200 L0 200 Z" fill="#0a0508" opacity=".75"/>
  <!-- House -->
  <g transform="translate(180 110)">
    <rect x="0" y="40" width="120" height="80" fill="#1c0c14" stroke="#3a1622" stroke-width="1"/>
    <polygon points="-10,40 60,-10 130,40" fill="#0c0509"/>
    <rect x="20" y="60" width="14" height="20" fill="#dc143c" opacity=".7"/>
    <rect x="50" y="60" width="14" height="20" fill="#dc143c" opacity=".45"/>
    <rect x="86" y="60" width="14" height="20" fill="#dc143c" opacity=".55"/>
    <rect x="55" y="92" width="14" height="28" fill="#3a1622"/>
    <rect x="2" y="20" width="20" height="28" fill="#1a0810" stroke="#dc143c" stroke-width=".5" opacity=".85"/>
    <rect x="4" y="22" width="16" height="24" fill="#dc143c" opacity=".55"/>
  </g>
  <!-- Road -->
  <path d="M0 200 L480 200 L460 270 L20 270 Z" fill="url(#ground1)"/>
  <path d="M236 200 L244 200 L246 270 L234 270 Z" fill="#dc143c" opacity=".18"/>
  <!-- Fog -->
  <ellipse cx="120" cy="220" rx="180" ry="30" fill="#dc143c" opacity=".06" filter="url(#blur1)"/>
  <ellipse cx="380" cy="230" rx="200" ry="35" fill="#dc143c" opacity=".05" filter="url(#blur1)"/>
  <!-- Vignette -->
  <rect width="480" height="270" fill="url(#vignette1)"/>
  <defs>
    <radialGradient id="vignette1" cx=".5" cy=".5" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
  </defs>
</svg>