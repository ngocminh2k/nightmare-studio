<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cửa sổ tầng hai · con mắt không ngủ">
  <defs>
    <linearGradient id="wall2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#160a14"/>
      <stop offset="1" stop-color="#08020a"/>
    </linearGradient>
    <radialGradient id="eye2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5e8c8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f5e8c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pupil2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#dc143c"/>
      <stop offset=".6" stop-color="#5b0a1a"/>
      <stop offset="1" stop-color="#0a0205"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <rect width="480" height="270" fill="url(#wall2)"/>
  <!-- Wall texture -->
  <g opacity=".25">
    <path d="M0 60 H480 M0 130 H480 M0 200 H480" stroke="#3a1622" stroke-width=".4"/>
    <path d="M40 0 V270 M120 0 V270 M200 0 V270 M280 0 V270 M360 0 V270 M440 0 V270" stroke="#3a1622" stroke-width=".4"/>
  </g>
  <!-- Window frame -->
  <g transform="translate(140 60)">
    <rect x="0" y="0" width="200" height="160" fill="#0a0408" stroke="#1a0810" stroke-width="3"/>
    <rect x="6" y="6" width="188" height="148" fill="#dc143c" opacity=".15" filter="url(#blur2)"/>
    <!-- Glow behind eye -->
    <ellipse cx="100" cy="80" rx="90" ry="60" fill="url(#eye2)"/>
    <!-- Eye -->
    <ellipse cx="100" cy="80" rx="70" ry="42" fill="#f5e8c8" opacity=".95"/>
    <ellipse cx="100" cy="80" rx="60" ry="34" fill="#f3d8b0"/>
    <ellipse cx="100" cy="80" rx="22" ry="22" fill="url(#pupil2)"/>
    <circle cx="100" cy="80" r="6" fill="#000"/>
    <circle cx="92" cy="74" r="2" fill="#fff" opacity=".9"/>
    <!-- Window bars -->
    <line x1="100" y1="0" x2="100" y2="160" stroke="#0a0408" stroke-width="2"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#0a0408" stroke-width="2"/>
    <!-- Frame -->
    <rect x="0" y="0" width="200" height="160" fill="none" stroke="#3a1622" stroke-width="3"/>
  </g>
  <!-- Faint text/whisper lines -->
  <g opacity=".18" fill="#f5e8c8" font-family="Georgia, serif" font-style="italic">
    <text x="40" y="40" font-size="11">…don't look up…</text>
    <text x="380" y="240" font-size="11" text-anchor="end">…she's still awake…</text>
  </g>
  <defs>
    <radialGradient id="vig2" cx=".5" cy=".5" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
  </defs>
  <rect width="480" height="270" fill="url(#vig2)"/>
</svg>