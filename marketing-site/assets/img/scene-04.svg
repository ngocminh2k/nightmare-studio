<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bà Whitmore trong chăn · run rẩy">
  <defs>
    <radialGradient id="bed4" cx=".5" cy=".5" r=".7">
      <stop offset="0" stop-color="#2c0a18"/>
      <stop offset="1" stop-color="#08020a"/>
    </radialGradient>
    <radialGradient id="face4" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#e8c5a8"/>
      <stop offset="1" stop-color="#7a4a2a"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <rect width="480" height="270" fill="url(#bed4)"/>
  <!-- Blanket -->
  <path d="M0 140 Q120 100 240 140 T 480 130 L480 270 L0 270 Z" fill="#3a1018"/>
  <path d="M0 170 Q120 130 240 170 T 480 160 L480 270 L0 270 Z" fill="#5b0a1a" opacity=".7"/>
  <path d="M0 200 Q120 170 240 200 T 480 195 L480 270 L0 270 Z" fill="#dc143c" opacity=".25"/>
  <!-- Fold lines -->
  <g stroke="#0a0205" stroke-width="1" fill="none" opacity=".4">
    <path d="M40 180 Q160 150 280 180 T 480 175"/>
    <path d="M30 210 Q140 190 260 210 T 480 210"/>
    <path d="M50 240 Q140 220 240 240 T 460 240"/>
  </g>
  <!-- Face -->
  <g transform="translate(180 70)">
    <!-- Hair -->
    <path d="M0 60 Q-10 0 60 0 Q120 5 120 70 Q110 30 60 25 Q10 25 0 60 Z" fill="#1a0810"/>
    <!-- Face -->
    <ellipse cx="60" cy="55" rx="48" ry="58" fill="url(#face4)"/>
    <!-- Eyes -->
    <ellipse cx="38" cy="48" rx="6" ry="3" fill="#fff" opacity=".7"/>
    <ellipse cx="82" cy="48" rx="6" ry="3" fill="#fff" opacity=".7"/>
    <circle cx="38" cy="48" r="2" fill="#dc143c"/>
    <circle cx="82" cy="48" r="2" fill="#dc143c"/>
    <!-- Tear -->
    <path d="M82 50 Q84 70 86 80" stroke="#dc143c" stroke-width="1.2" fill="none" opacity=".7"/>
    <!-- Mouth -->
    <path d="M44 88 Q60 84 76 88" stroke="#3a1622" stroke-width="1.5" fill="none"/>
    <!-- Hand gripping blanket -->
    <path d="M-30 110 Q-10 95 10 105 Q15 115 0 125 Q-15 130 -30 120 Z" fill="url(#face4)" opacity=".9"/>
  </g>
  <!-- Whisper -->
  <g opacity=".18" fill="#f5e8c8" font-family="Georgia, serif" font-style="italic">
    <text x="30" y="40" font-size="11">…closer than last night…</text>
  </g>
  <defs>
    <radialGradient id="vig4" cx=".5" cy=".5" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
  </defs>
  <rect width="480" height="270" fill="url(#vig4)"/>
</svg>