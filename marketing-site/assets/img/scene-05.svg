<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tay nắm cửa · chiếc then thò ra">
  <defs>
    <linearGradient id="wall5" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1c0c14"/>
      <stop offset="1" stop-color="#08020a"/>
    </linearGradient>
    <radialGradient id="lamp5" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#dc143c" stop-opacity=".4"/>
      <stop offset="1" stop-color="#dc143c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur5"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="480" height="270" fill="url(#wall5)"/>
  <!-- Wall panels -->
  <g stroke="#3a1622" stroke-width=".5" opacity=".4">
    <path d="M120 0 V270 M240 0 V270 M360 0 V270"/>
    <circle cx="120" cy="135" r="2" fill="#3a1622"/>
    <circle cx="240" cy="135" r="2" fill="#3a1622"/>
    <circle cx="360" cy="135" r="2" fill="#3a1622"/>
  </g>
  <!-- Lamp glow above -->
  <circle cx="240" cy="60" r="80" fill="url(#lamp5)"/>
  <!-- Door -->
  <g transform="translate(170 30)">
    <rect x="0" y="0" width="140" height="220" fill="#0c0509" stroke="#3a1622" stroke-width="2"/>
    <rect x="6" y="6" width="128" height="208" fill="#1a0810" opacity=".7"/>
    <!-- Panels -->
    <rect x="14" y="14" width="50" height="80" fill="none" stroke="#3a1622" stroke-width="1.5"/>
    <rect x="76" y="14" width="50" height="80" fill="none" stroke="#3a1622" stroke-width="1.5"/>
    <rect x="14" y="110" width="50" height="80" fill="none" stroke="#3a1622" stroke-width="1.5"/>
    <rect x="76" y="110" width="50" height="80" fill="none" stroke="#3a1622" stroke-width="1.5"/>
    <!-- Handle -->
    <rect x="115" y="100" width="6" height="20" rx="2" fill="#dc143c" opacity=".8"/>
    <!-- Keyhole -->
    <circle cx="110" cy="105" r="3" fill="#000"/>
    <path d="M110 108 L108 118 L112 118 Z" fill="#000"/>
    <!-- Crack of light -->
    <rect x="138" y="0" width="2" height="220" fill="#dc143c" opacity=".6" filter="url(#blur5)"/>
  </g>
  <!-- Hand reaching toward handle -->
  <g transform="translate(280 100)" opacity=".8">
    <path d="M0 0 Q-20 -10 -40 0 Q-50 10 -50 30 L-50 60 Q-40 80 -20 75 L0 50 Z" fill="#3a1622" stroke="#dc143c" stroke-width=".5" opacity=".9"/>
    <ellipse cx="-50" cy="40" rx="6" ry="10" fill="#3a1622"/>
    <!-- Fingers -->
    <ellipse cx="-40" cy="20" rx="4" ry="8" fill="#3a1622"/>
    <ellipse cx="-30" cy="14" rx="4" ry="10" fill="#3a1622"/>
    <ellipse cx="-20" cy="16" rx="4" ry="9" fill="#3a1622"/>
    <ellipse cx="-10" cy="22" rx="4" ry="8" fill="#3a1622"/>
  </g>
  <defs>
    <radialGradient id="vig5" cx=".5" cy=".5" r=".8">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
  </defs>
  <rect width="480" height="270" fill="url(#vig5)"/>
</svg>