<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Trời sáng · cảnh cuối cùng">
  <defs>
    <linearGradient id="dawn7" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0207"/>
      <stop offset=".5" stop-color="#3b0a18"/>
      <stop offset="1" stop-color="#7d2a3a"/>
    </linearGradient>
    <radialGradient id="sun7" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5e8c8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f5e8c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur7"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="480" height="270" fill="url(#dawn7)"/>
  <!-- Sun -->
  <circle cx="380" cy="200" r="40" fill="url(#sun7)"/>
  <circle cx="380" cy="200" r="14" fill="#f5e8c8" opacity=".5"/>
  <!-- Silhouettes -->
  <g fill="#0a0408">
    <path d="M0 200 L40 160 L60 195 L100 150 L120 200 L160 165 L180 200 L220 155 L260 200 L300 145 L340 200 L380 165 L420 200 L460 160 L480 200 L480 270 L0 270 Z"/>
  </g>
  <!-- House silhouette -->
  <g transform="translate(180 140)" fill="#0a0408">
    <rect x="0" y="20" width="120" height="60"/>
    <polygon points="-10,20 60,-20 130,20"/>
    <rect x="48" y="60" width="14" height="20" fill="#dc143c" opacity=".4"/>
  </g>
  <!-- Mist -->
  <ellipse cx="120" cy="220" rx="180" ry="30" fill="#f5e8c8" opacity=".08" filter="url(#blur7)"/>
  <ellipse cx="380" cy="230" rx="200" ry="35" fill="#dc143c" opacity=".05" filter="url(#blur7)"/>
  <defs>
    <radialGradient id="vig7" cx=".5" cy=".5" r=".8">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </radialGradient>
  </defs>
  <rect width="480" height="270" fill="url(#vig7)"/>
</svg>