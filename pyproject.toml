[project]
name = "nightmare-studio"
version = "1.0.0"
description = "Local-first editorial desk for horror video production"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5.0",
  "fastapi>=0.115,<1.0",
  "pillow>=10.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.0",
  "httpx>=0.27",
  "playwright>=1.50",
  "pytest>=8.0",
]

# Flat-layout auto-discovery trips over the top-level web/ assets/ dashboard/
# directories ("Multiple top-level packages discovered"). Only the backend is
# an installable package.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

# Pin the rule set explicitly. Ruff 0.16 ships a much wider default rule set
# than the E4/E7/E9/F it used to default to, which turned the CI lint gate
# red on code that was never written against those rules.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

